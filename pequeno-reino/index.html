<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#3a2a1c" />
    <title>Pequeno Reino</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;700&family=Nunito:wght@500;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main id="app">
      <canvas id="game-canvas" aria-label="Diorama do Pequeno Reino"></canvas>

      <div id="ui-root">
        <section id="screen-title" class="screen">
          <div class="panel title-panel">
            <img class="title-hero" src="/images/title-hero.png" alt="" width="360" height="200" />
            <p class="kicker">Cartas · hexágonos · sem pressa</p>
            <h1>Pequeno Reino</h1>
            <p class="lead">Um reino no bolso. Cada carta é um pedaço de chão, um telhado ou um aldeão.</p>
            <div class="btn-col">
              <button id="btn-play" type="button" class="btn primary">Jogar</button>
              <button id="btn-continue" type="button" class="btn">Continuar</button>
              <button id="btn-map" type="button" class="btn">Mapa da campanha</button>
              <button id="btn-album" type="button" class="btn">Álbum de tiles</button>
              <button id="btn-options" type="button" class="btn">Opções</button>
            </div>
          </div>
        </section>

        <section id="screen-map" class="screen" hidden>
          <div class="panel wide">
            <header class="panel-head">
              <h2>Campanha das estações</h2>
              <button type="button" class="btn ghost" data-back-title>Voltar</button>
            </header>
            <div id="phase-nodes" class="phase-nodes"></div>
          </div>
        </section>

        <section id="screen-album" class="screen" hidden>
          <div class="panel wide">
            <header class="panel-head">
              <h2>Álbum de tiles</h2>
              <button type="button" class="btn ghost" data-back-title>Voltar</button>
            </header>
            <div id="album-grid" class="album-grid"></div>
          </div>
        </section>

        <section id="screen-options" class="screen" hidden>
          <div class="panel">
            <header class="panel-head">
              <h2>Opções</h2>
              <button type="button" class="btn ghost" data-back-title>Voltar</button>
            </header>
            <label class="check">
              <input id="opt-music" type="checkbox" checked />
              Som
            </label>
            <label class="check">
              <input id="opt-particles" type="checkbox" />
              Reduzir partículas
            </label>
          </div>
        </section>

        <section id="screen-play" class="screen play" hidden>
          <div class="hud-top">
            <div class="phase-label">
              <strong id="phase-title">Primavera</strong>
              <span id="phase-sub"></span>
            </div>
            <div class="stats">
              <div class="stat natureza"><span>Natureza</span><strong id="stat-natureza">0</strong></div>
              <div class="stat povo"><span>Povo</span><strong id="stat-povo">0</strong></div>
              <div class="stat agua"><span>Água</span><strong id="stat-agua">0</strong></div>
              <div class="stat"><span>Pão</span><strong id="stat-pao">0</strong></div>
              <div class="stat"><span>Povoado</span><strong id="stat-pop">0</strong></div>
              <div class="stat"><span>Baralho</span><strong id="stat-deck">0</strong></div>
            </div>
            <button id="btn-pause" type="button" class="btn ghost">Pausar</button>
          </div>

          <aside id="quest-box">
            <h3>Missões</h3>
            <ul id="quest-list"></ul>
          </aside>

          <div class="hud-bottom">
            <div id="card-hand" class="card-hand"></div>
            <button id="btn-pack" type="button" class="btn pack">Novo pacote</button>
            <button id="btn-end-day" type="button" class="btn ghost" hidden>Encerrar o dia</button>
          </div>
        </section>

        <div id="pause-overlay" class="overlay" hidden>
          <div class="panel">
            <h2>Pausa</h2>
            <p>O reino espera sem pressa.</p>
            <div class="btn-col">
              <button id="btn-resume" type="button" class="btn primary">Continuar o jogo</button>
              <button id="btn-quit" type="button" class="btn">Tela inicial</button>
            </div>
          </div>
        </div>

        <div id="modal" class="overlay" hidden>
          <div class="panel">
            <h2 id="modal-title">Fase</h2>
            <p id="modal-body"></p>
            <p id="modal-unlock" class="unlock"></p>
            <div class="btn-col">
              <button id="btn-next-phase" type="button" class="btn primary">Próxima fase</button>
              <button id="btn-retry" type="button" class="btn primary">Tentar de novo</button>
              <button id="btn-close-modal" type="button" class="btn">Mapa</button>
            </div>
          </div>
        </div>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
